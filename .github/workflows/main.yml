name: Android TV CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Modified to jump into your subfolder to change permissions
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android_tv/gradlew

      # Modified to run the build command inside your subfolder
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android_tv

      # Modified path to locate the APK inside your subfolder
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-debug-apk
          path: android_tv/app/build/outputs/apk/debug/app-debug.apk
